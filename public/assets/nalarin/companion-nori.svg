    <path d="M-60,-88 L-66,-118 L-38,-102 Z" fill="#ffb3d6" stroke="#ffb3d6" stroke-width="6" stroke-linejoin="round"/>
    <path d="M60,-88 L66,-118 L38,-102 Z" fill="#ffb3d6" stroke="#ffb3d6" stroke-width="6" stroke-linejoin="round"/>

    <!-- head -->
    <ellipse cx="0" cy="-40" rx="74" ry="66" fill="url(#catHead)"/>
    <!-- forehead marks -->
    <g stroke="#5a3fd0" stroke-width="5" stroke-linecap="round" fill="none">
