      <stop offset="0" stop-color="#a98dff"/>
      <stop offset="1" stop-color="#6f52e6"/>
    </linearGradient><filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter></defs>
  <g transform="translate(0,0) scale(1)">
